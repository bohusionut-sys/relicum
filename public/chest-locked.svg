<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-label="Locked iron reliquary chest">
  <defs>
    <linearGradient id="iron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3d44"/>
      <stop offset="38%" stop-color="#1c1e24"/>
      <stop offset="100%" stop-color="#0d0e12"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4e57"/>
      <stop offset="55%" stop-color="#23262d"/>
      <stop offset="100%" stop-color="#14161c"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8ccd4"/>
      <stop offset="40%" stop-color="#8a909a"/>
      <stop offset="100%" stop-color="#3e434c"/>
    </linearGradient>
    <linearGradient id="lock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d5d8de"/>
      <stop offset="45%" stop-color="#9aa1ab"/>
      <stop offset="100%" stop-color="#2c3038"/>
    </linearGradient>
    <radialGradient id="room" cx="50%" cy="18%" r="78%">
      <stop offset="0%" stop-color="#1a1b20" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#08080a" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.09"/>
      </feComponentTransfer>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>
  <rect width="640" height="520" fill="#08080a"/>
  <rect width="640" height="520" fill="url(#room)"/>
  <!-- plinth -->
  <ellipse cx="320" cy="458" rx="210" ry="18" fill="#000" opacity="0.55"/>
  <rect x="168" y="430" width="304" height="22" rx="2" fill="#16171c" stroke="#2a2c32" stroke-width="1"/>
  <rect x="176" y="426" width="288" height="8" fill="#1e2026"/>
  <!-- body -->
  <g transform="translate(0,8)">
    <path d="M148 248 h344 v168 c0 10-8 16-18 16 H166 c-10 0-18-6-18-16 z" fill="url(#iron)" stroke="#2c3038" stroke-width="1.5"/>
    <path d="M148 248 h344 v24 H148 z" fill="#2a2e36" opacity="0.5"/>
    <!-- lid -->
    <path d="M138 248 L170 168 h300 l32 80 z" fill="url(#lid)" stroke="#3a3e46" stroke-width="1.4"/>
    <path d="M170 168 h300 l8 18 H162 z" fill="#5a5f69" opacity="0.35"/>
    <!-- bands -->
    <rect x="148" y="292" width="344" height="16" fill="#12141a" stroke="#4a4e56" stroke-width="0.8"/>
    <rect x="148" y="368" width="344" height="16" fill="#12141a" stroke="#4a4e56" stroke-width="0.8"/>
    <path d="M214 168 L188 248 v168" fill="none" stroke="#4a4e56" stroke-width="10"/>
    <path d="M426 168 L452 248 v168" fill="none" stroke="#4a4e56" stroke-width="10"/>
    <path d="M214 168 L188 248 v168" fill="none" stroke="#1a1c22" stroke-width="4"/>
    <path d="M426 168 L452 248 v168" fill="none" stroke="#1a1c22" stroke-width="4"/>
    <!-- rivets -->
    <g fill="url(#steel)">
      <circle cx="188" cy="300" r="4.2"/><circle cx="452" cy="300" r="4.2"/>
      <circle cx="188" cy="376" r="4.2"/><circle cx="452" cy="376" r="4.2"/>
      <circle cx="220" cy="176" r="3.4"/><circle cx="320" cy="176" r="3.4"/><circle cx="420" cy="176" r="3.4"/>
      <circle cx="168" cy="300" r="3.2"/><circle cx="320" cy="300" r="3.2"/><circle cx="472" cy="300" r="3.2"/>
      <circle cx="168" cy="376" r="3.2"/><circle cx="320" cy="376" r="3.2"/><circle cx="472" cy="376" r="3.2"/>
    </g>
    <!-- hasp -->
    <rect x="300" y="232" width="40" height="58" rx="3" fill="#0e1014" stroke="url(#steel)" stroke-width="2"/>
    <rect x="308" y="240" width="24" height="18" rx="1" fill="#1a1d24"/>
    <!-- padlock -->
    <g transform="translate(320,286)">
      <path d="M-14 -8 v-16 a14 14 0 0 1 28 0 v16" fill="none" stroke="url(#lock)" stroke-width="6" stroke-linecap="round"/>
      <rect x="-22" y="-8" width="44" height="38" rx="5" fill="url(#lock)" stroke="#ecece8" stroke-opacity="0.18"/>
      <circle cx="0" cy="10" r="5" fill="#08080a"/>
      <rect x="-1.5" y="10" width="3" height="10" rx="1" fill="#08080a"/>
    </g>
    <!-- cold edge light -->
    <path d="M170 168 h300" stroke="#c8ccd4" stroke-opacity="0.28" stroke-width="1"/>
    <path d="M148 248 h344" stroke="#c8ccd4" stroke-opacity="0.12" stroke-width="1"/>
  </g>
  <rect width="640" height="520" filter="url(#grain)" opacity="0.45"/>
</svg>
